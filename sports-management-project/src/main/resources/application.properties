# PostgreSQL Configuration (Neon)
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/sportsclub}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# MongoDB Configuration (Atlas)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sportsclub}
spring.data.mongodb.database=${MONGODB_DATABASE:sportsclub}

# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=sports-management-system

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.sportsclub=DEBUG
logging.level.org.hibernate.SQL=DEBUG